<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a26" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var d = document.documentElement;
    // The theme is never stored: every page load follows the system colour scheme. (Drops a
    // choice saved by an earlier version of the site.)
    try { localStorage.removeItem('lmib-theme'); } catch (e) {}
    // Large screens scale the page up (see base.css). The navigation bar and the footer only
    // follow a third of that growth: --chrome-zoom is the factor that brings them back down.
    var chrome = function () {
      var scale = Math.min(Math.max(16, window.innerWidth / 100), 36) / 16;
      d.style.setProperty('--chrome-zoom', ((1 + (scale - 1) * 0.3) / scale).toFixed(4));
    };
    chrome();
    window.addEventListener('resize', chrome);
    if ('IntersectionObserver' in window) {
      d.classList.add('js-reveal');
      // fail-safe: never leave content hidden
      setTimeout(function () { if (!window.__lmibMounted) d.classList.remove('js-reveal'); }, 3000);
    }
  })();
</script>
</head>
<body>
<div id="app"><!--app-html--></div>

</body>

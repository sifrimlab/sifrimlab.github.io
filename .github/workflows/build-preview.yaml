name: build-preview
run-name: build pull request preview

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Compile Markdown content and build preview site
        if: github.event.action != 'closed'
        run: npm run build
        env:
          # previews are served from a sub-path, e.g. /preview/pr-12/
          BASE_PATH: /${{ env.PREVIEWS_FOLDER }}/pr-${{ github.event.number }}/

      - name: Commit preview to Pages branch
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          umbrella-dir: ${{ env.PREVIEWS_FOLDER }}

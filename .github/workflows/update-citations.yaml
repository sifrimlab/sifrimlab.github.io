name: update-citations
run-name: update citations

# Weekly: pull the group leader's publications from ORCID and Google Scholar (+ pinned
# ids in _data/sources.yaml), regenerate _data/citations.yaml, commit it to main and
# redeploy the site. Nothing is committed if the result fails validation.

on:
  schedule:
    # every Monday, 03:00 UTC
    - cron: "0 3 * * 1"

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-citations
  cancel-in-progress: false

env:
  FORCE_COLOR: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "_cite/requirements.txt"

      - name: Cache Manubot / Crossref lookups
        uses: actions/cache@v4
        with:
          path: _cite/.cache
          key: cite-cache-${{ github.run_id }}
          restore-keys: cite-cache-

      - name: Install Python packages
        run: python -m pip install --upgrade --requirement ./_cite/requirements.txt

      # Google Scholar failures are warnings; ORCID/pinned failures or invalid output fail the job
      - name: Build updated citations
        run: python _cite/cite.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # integrity gate: fails if a page references a citation id that is missing, a date is
      # missing, etc. so a bad scrape never reaches main
      - name: Validate against the site content
        run: npm run content:compile

      - name: Commit updated citations to main
        id: commit
        run: |
          if git diff --quiet -- _data/citations.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Citations unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/citations.yaml
            git commit -m "Update citations"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # commits made with GITHUB_TOKEN do not trigger other workflows, so deploy explicitly
  deploy:
    needs: update-citations
    if: needs.update-citations.outputs.changed == 'true'
    uses: ./.github/workflows/build-site.yaml
    with:
      ref: main

name: build-site
run-name: build live site

on:
  # run when called from another workflow
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile Markdown content and build static Vue 3 site
        run: npm run build

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false

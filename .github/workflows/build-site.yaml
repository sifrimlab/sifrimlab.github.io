name: build-site
run-name: build and deploy live site

on:
  # run when called from another workflow
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

  # run if user manually requests it
  workflow_dispatch:

# the caller's permissions cap these, so callers must grant pages + id-token too
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; let a running deploy finish rather than cancel it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch contents
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile Markdown content and build static Vue 3 site
        run: npm run build

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

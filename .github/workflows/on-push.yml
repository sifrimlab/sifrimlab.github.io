name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-site:
    uses: ./.github/workflows/build-site.yaml
    with:
      ref: ${{ github.sha }}
